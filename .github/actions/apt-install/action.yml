name: Install apt packages
description: Install Ubuntu packages, from the Actions cache once this runner image has fetched them.
inputs:
  packages:
    description: Space-separated package names.
    required: true
runs:
  using: composite
  steps:
    # The env context leaves out the runner's own variables, so read them in a step.
    - id: image
      shell: bash
      run: echo "version=${ImageOS}-${ImageVersion}" >> "${GITHUB_OUTPUT}"
    - uses: actions/cache@v6
      with:
        path: ~/apt-debs
        # Debs pin exact dependency versions, so they only fit the image that fetched them.
        key: apt-${{ steps.image.outputs.version }}-${{ runner.arch }}-${{ inputs.packages }}
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        # *.ubuntu.com can stay unresolvable for a whole job, so reach it only on a cache miss.
        shopt -s nullglob
        read -ra packages <<< "${PACKAGES}"
        dir=~/apt-debs
        archives=/var/cache/apt/archives
        install=(sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends)
        cached=("${dir}"/*.deb)
        if (( ${#cached[@]} )) && sudo cp "${cached[@]}" "${archives}/" && "${install[@]}" --no-download "${packages[@]}"; then
          exit 0
        fi
        # Fetch against the image's own package lists, which the next run on this image shares.
        sudo apt-get clean
        if "${install[@]}" --download-only "${packages[@]}"; then
          mkdir -p "${dir}"
          debs=("${archives}"/*.deb)
          if (( ${#debs[@]} )); then cp "${debs[@]}" "${dir}/"; fi
        else
          sudo apt-get -o Acquire::Retries=3 update
        fi
        "${install[@]}" "${packages[@]}"
