name: Install apt packages
description: Install Ubuntu packages, from the Actions cache once this runner image has fetched them.
inputs:
  packages:
    description: Space-separated package names.
    required: true
runs:
  using: composite
  steps:
    # Debs are fetched against the image's package lists, so they only fit runners with the same lists.
    - id: lists
      shell: bash
      run: echo "hash=$(cat /var/lib/apt/lists/*Release 2>/dev/null | sha256sum | cut -c1-16)" >> "${GITHUB_OUTPUT}"
    - uses: actions/cache@v6
      with:
        path: ~/apt-debs
        key: apt-${{ runner.arch }}-${{ steps.lists.outputs.hash }}-${{ inputs.packages }}
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        # *.ubuntu.com can stay unresolvable for a whole job, so reach it only on a cache miss.
        shopt -s nullglob
        read -ra packages <<< "${PACKAGES}"
        dir=~/apt-debs
        archives=/var/cache/apt/archives
        install=(sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends)
        cached=("${dir}"/*.deb)
        if (( ${#cached[@]} )) && sudo cp "${cached[@]}" "${archives}/" && "${install[@]}" --no-download "${packages[@]}"; then
          exit 0
        fi
        # Fetch against the image's own package lists, which the next run on this image shares.
        sudo apt-get clean
        if "${install[@]}" --download-only "${packages[@]}"; then
          mkdir -p "${dir}"
          debs=("${archives}"/*.deb)
          if (( ${#debs[@]} )); then cp "${debs[@]}" "${dir}/"; fi
        else
          echo "::notice::The image's package lists are out of date, so these packages are not cached."
          sudo apt-get -o Acquire::Retries=3 update
        fi
        "${install[@]}" "${packages[@]}"
