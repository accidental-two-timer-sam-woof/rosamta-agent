[package]
name = "rosamta-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
indexmap = { version = "2.14.2", features = ["serde"] }
keyring = "4.2.0"
libc = "0.2.191"
regex = "1.13.1"
schemars = { version = "1.2.3", features = ["indexmap2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
thiserror = "2.0.21"
toml = "1.2.1"
toml_edit = "0.25.19"
# `rustls` minus its bundled webpki-roots (CDLA-Permissive-2.0): certificates
# are checked against the OS trust store instead.
ureq = { version = "3.5.1", default-features = false, features = ["_ring", "json", "platform-verifier", "rustls-no-provider"] }

[build-dependencies]
regex = "1.13.1"
toml = "1.2.1"

[dev-dependencies]
jsonschema = "0.61.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
